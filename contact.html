    <section id="contact" class="contact-area innerpage-single-area">
        <div class="container">
            <div class="container-inner">
                <div class="row">
                    <div class="col-xl-12 col-lg-12">
                        <div class="section-title text-center wow fadeInUp delay-0-2s">
                            <p>Contact</p>
                            <h2>Get in Touch with Me!</h2>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-4">
                        <div class="contact-content-part wow fadeInUp delay-0-2s">
                            <div class="single-contact wow fadeInUp" data-wow-delay=".2s">
                                <div class="contact-icon">
                                    <i class="ri-map-pin-line"></i>
                                </div>
                                <h2>Location:</h2>
                                <p>Washington, DC</p>
                            </div>
                            <div class="single-contact wow fadeInUp" data-wow-delay=".4s">
                                <div class="contact-icon">
                                    <i class="ri-phone-line"></i>
                                </div>
                                <h2>Phone:</h2>
                                <p>(804) 654-9434</p>
                            </div>
                            <div class="single-contact wow fadeInUp" data-wow-delay=".6s">
                                <div class="contact-icon">
                                    <i class="ri-mail-line"></i>
                                </div>
                                <h2>Email:</h2>
                                <p>masonkelly801@gmail.com</p>
                            </div>
                        </div>
                    </div>
                    <!-- START CONTACT FORM DESIGN AREA -->
                    <div class="col-lg-8">
                        <div class="contact-form contact-form-area wow fadeInUp delay-0-4s">
                            <form id="contactForm" class="contactForm" name="contactForm">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="name">Full Name</label>
                                            <input type="text" id="name" name="name" class="form-control" value="" placeholder="Your Name" required="" data-error="Please enter your Name" />
                                            <div class="help-block with-errors"></div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="email">Email Address</label>
                                            <input type="email" id="email" name="email" class="form-control" value="" placeholder="your@email.com" required="" data-error="Please enter your Email" />
                                            <div class="help-block with-errors"></div>
                                        </div>
                                    </div>
                                    <div class="col-md-12">
                                        <div class="form-group">
                                            <label for="message">Your Message</label>
                                            <textarea name="message" id="message" class="form-control" rows="4" placeholder="Write your message" required="" data-error="Please write your message"></textarea>
                                            <div class="help-block with-errors"></div>
                                        </div>
                                    </div>
                                    <div class="col-md-12">
                                        <div class="form-group mb-0">
                                            <button type="submit" class="theme-btn">
                                                Send Message <i class="ri-mail-line"></i>
                                            </button>
                                            <div id="msgSubmit" class="hidden"></div>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                    <!-- / END CONTACT FORM DESIGN AREA -->
                </div>
            </div>
        </div>
    </section>
